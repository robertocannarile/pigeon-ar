<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Pigeon AR</title>

  <script src="https://cdn.jsdelivr.net/npm/aframe@1.7.1/dist/aframe-master.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous"
    data-preload-chunks="slam"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous"></script>

  <script src="./place-pigeon.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }

    #hint {
      position: fixed;
      bottom: 7vh;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 20px;
      border-radius: 999px;
      background: rgba(0, 0, 0, .55);
      color: #fff;
      font: 500 15px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: .01em;
      white-space: nowrap;
      z-index: 10;
      pointer-events: none;
      transition: opacity .4s ease;
    }

    #hint.hidden { opacity: 0; }

    /* Cerchio che si chiude sotto il dito durante la pressione prolungata. */
    #press {
      position: fixed;
      width: 76px;
      height: 76px;
      margin: -38px 0 0 -38px;
      border: 2px solid rgba(255, 255, 255, .9);
      border-radius: 50%;
      z-index: 15;
      pointer-events: none;
      opacity: .35;
      transform: scale(1);
      transition-property: transform, opacity;
      transition-timing-function: linear;
    }

    #press.active { transform: scale(.32); opacity: 1; }

    #press[hidden] { display: none; }

    /* Il logo "Powered by 8th Wall" degli schermi di caricamento/errore di xrextras. */
    .poweredby-img { display: none !important; }

    /* Attribuzione richiesta dalla licenza del motore, vedi il markup sotto. */
    #engine-credit {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 6px);
      left: 50%;
      transform: translateX(-50%);
      max-width: 92vw;
      text-align: center;
      color: rgba(255, 255, 255, .5);
      text-shadow: 0 1px 3px rgba(0, 0, 0, .7);
      font: 400 10px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      z-index: 12;
      pointer-events: none;
    }

    /* Solo il link intercetta il tocco: il resto lo passa al canvas del piazzamento. */
    #engine-credit a { color: inherit; pointer-events: auto; }

    /* Pannello di taratura, aperto con doppio tap. Da rimuovere a valori fissati. */
    #tuner {
      position: fixed;
      top: calc(env(safe-area-inset-top, 12px) + 12px);
      right: 12px;
      width: min(78vw, 300px);
      padding: 14px 16px 16px;
      border-radius: 14px;
      background: rgba(0, 0, 0, .72);
      backdrop-filter: blur(8px);
      color: #fff;
      font: 500 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      z-index: 20;
    }

    #tuner[hidden] { display: none; }

    #tuner label {
      display: flex;
      justify-content: space-between;
      margin: 12px 0 4px;
      opacity: .85;
      letter-spacing: .02em;
    }

    #tuner label b { font-variant-numeric: tabular-nums; opacity: 1; }

    #tuner input[type="range"] { width: 100%; margin: 0; accent-color: #fff; }

    #tuner .row { display: flex; gap: 8px; margin-top: 14px; }

    #tuner button {
      flex: 1;
      padding: 9px 0;
      border: 0;
      border-radius: 9px;
      background: rgba(255, 255, 255, .16);
      color: #fff;
      font: 600 13px -apple-system, BlinkMacSystemFont, sans-serif;
    }

    #tuner-out {
      margin-top: 12px;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, .08);
      font: 500 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      word-break: break-all;
      opacity: .9;
    }
  </style>
</head>

<body>
  <div id="hint">Muovi il telefono, poi tieni premuto sul pavimento</div>

  <div id="press" hidden></div>

  <!-- Attribuzione al motore AR, richiesta dalla sua licenza (XR Engine License
       Agreement, 1.3.1.2): creatore, copyright, rimando alla licenza e disclaimer. -->
  <div id="engine-credit">
    AR engine &copy; 2026 Niantic Spatial, Inc. &mdash;
    <a href="https://8thwall.org/docs/open-source" target="_blank" rel="noopener">licenza</a>
    &middot; fornito &ldquo;as is&rdquo;, senza garanzie
  </div>

  <!-- Pannello di taratura: doppio tap sullo schermo per aprirlo e chiuderlo. -->
  <div id="tuner" hidden>
    <label>Esposizione <b data-out="exposure">—</b></label>
    <input type="range" data-key="exposure" min="0.4" max="4" step="0.05">

    <label>Ambiente (envMap) <b data-out="env">—</b></label>
    <input type="range" data-key="env" min="0" max="8" step="0.1">

    <label>Sole <b data-out="sun">—</b></label>
    <input type="range" data-key="sun" min="0" max="8" step="0.1">

    <label>Cielo/terra <b data-out="hemi">—</b></label>
    <input type="range" data-key="hemi" min="0" max="4" step="0.05">

    <label>Scala piccione <b data-out="scale">—</b></label>
    <input type="range" data-key="scale" min="0" max="1" step="0.001">

    <div class="row">
      <button data-action="reset">Reset</button>
      <button data-action="copy">Copia valori</button>
    </div>

    <div id="tuner-out">—</div>
  </div>

  <a-scene
    xrweb
    xrextras-gesture-detector
    xrextras-almost-there
    xrextras-loading
    xrextras-runtime-error
    renderer="colorManagement: true; antialias: true; toneMapping: ACESFilmic; exposure: 1.6"
    shadow="type: pcfsoft"
    env-light="sky: #b9cfe4; horizon: #efe9dd; ground: #6f6659; intensity: 2.2"
    tap-place="target: #pigeon; ground: #ground; hint: #hint;
               progress: #press; holdMs: 600"
    shadow-fit="light: #sun; target: #pigeon"
    light-tuner="sun: #sun; hemi: #hemi; target: #pigeon">

    <a-assets>
      <a-asset-item id="pigeon-model" src="./assets/pigeon.glb"></a-asset-item>
    </a-assets>

    <!-- Luce ambientale dal cielo/terra + una direzionale che proietta l'ombra -->
    <a-light id="hemi" type="hemisphere" color="#cfe0f0" groundColor="#6f6659" intensity="0.9"></a-light>
    <a-light
      id="sun"
      type="directional"
      intensity="2.6"
      position="1.5 3 1"
      castShadow="true"
      light="shadowMapWidth: 2048; shadowMapHeight: 2048;
             shadowCameraTop: 3; shadowCameraBottom: -3;
             shadowCameraLeft: -3; shadowCameraRight: 3;
             shadowCameraFar: 60"></a-light>

    <!-- Piano invisibile: riceve i tap del raycast e cattura l'ombra -->
    <a-entity
      id="ground"
      class="cantap"
      geometry="primitive: plane; width: 600; height: 600"
      rotation="-90 0 0"
      position="0 0 0"
      material="shader: shadow; opacity: 0.32"
      shadow="receive: true; cast: false"></a-entity>

    <!-- Il piccione. Nascosto finché non lo piazzi. -->
    <a-entity
      id="pigeon"
      visible="false"
      gltf-model="#pigeon-model"
      play-clip="fromFrame: 840; toFrame: 1664; fps: 24; loop: true"
      shadow="cast: true; receive: false"
      xrextras-pinch-scale="min: 0.5; max: 150"
      xrextras-two-finger-rotate></a-entity>

    <!-- Niente raycaster/cursor: il piazzamento fa il proprio raycast da tap-place. -->
    <a-camera position="0 1.6 0"></a-camera>

  </a-scene>
</body>

</html>
